# Production setup for one server: database, OCR service, app, and Caddy for
# HTTPS. Start it with:
#   docker compose --env-file .env.production up -d --build
# See DEPLOY.md.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yummy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: yummynakha
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yummy", "-d", "yummynakha"]
      interval: 5s
      retries: 20

  ocr:
    build: ./ocr-service
    # PaddlePaddle ships Linux wheels for x86 only (not ARM).
    platform: linux/amd64
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://yummy:${POSTGRES_PASSWORD}@db:5432/yummynakha?schema=public
      OCR_SERVICE_URL: http://ocr:8765
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
